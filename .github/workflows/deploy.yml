name: Render CI/CD Pipeline

on:
  push:
    branches: [ main ] # Change this if your default branch is named master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Install pnpm first so actions/setup-node can find it for caching
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    # FIXED: Changed 'action/setup-node' to 'actions/setup-node'
    - name: Set up Node.js & pnpm cache
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Verify Build Works
      run: pnpm run build

    - name: Trigger Render Deploy Hook
      if: success()
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
