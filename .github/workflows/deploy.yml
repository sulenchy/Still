name: Render CI/CD Pipeline

on:
  push:
    branches: [ main ] # Change this if your default branch is named master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Verify Build Works
      run: npm run build # Ensures TypeScript/Vite errors block broken deployments

    - name: Trigger Render Deploy Hook
      if: success() # Only deploys if the build command succeeds
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
