name: Render CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        # Removing the automation cache step temporarily to ensure zero interference

    # Use native Corepack to install and match your exact pnpm version
    - name: Enable Corepack & Install pnpm
      run: |
        corepack enable
        corepack prepare pnpm@latest --activate

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Verify Build Works
      run: pnpm run build

    - name: Trigger Render Deploy Hook
      if: success()
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
